<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0B0E14">
<title>Word Guess — XD_Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/game-shared.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="game-body">
<header class="game-header">
  <a href="../../index.html" class="back-link">&larr; XD_Arcade</a>
  <h1 class="game-title">Word Guess</h1>
</header>
<main class="game-main">
  <div class="scoreboard">
    <div class="score-item"><span class="score-label">Played</span><span class="score-val" id="playedVal">0</span></div>
    <div class="score-item"><span class="score-label">Wins</span><span class="score-val" id="winsVal">0</span></div>
    <div class="score-item"><span class="score-label">Streak</span><span class="score-val" id="streakVal">0</span></div>
  </div>
  <div class="wg-board" id="board" aria-label="Guess board"></div>
  <p class="turn-indicator" id="statusMsg">Guess the 5-letter word in 6 tries</p>
  <div class="wg-kb" id="kb"></div>
  <button class="reset-btn" id="resetBtn">New word</button>
</main>
<script src="../../js/pause.js"></script>
<script src="game.js"></script>
</body>
</html>
