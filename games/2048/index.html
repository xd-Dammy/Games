<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0B0E14">
<title>2048 — XD_Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="game-body">

<header class="game-header">
  <a href="../../index.html" class="back-link">&larr; XD_Arcade</a>
  <h1 class="game-title">2048</h1>
</header>

<main class="game-main">
  <div class="scoreboard">
    <div class="score-item">
      <span class="score-label">Score</span>
      <span class="score-val" id="scoreVal">0</span>
    </div>
    <div class="score-item">
      <span class="score-label">Best</span>
      <span class="score-val" id="bestVal">0</span>
    </div>
  </div>

  <div class="board-2048-wrap">
    <div class="board-2048" id="board2048"></div>
    <div class="tiles-layer" id="tilesLayer"></div>
    <div class="overlay hidden" id="overlay">
      <p class="overlay-msg" id="overlayMsg"></p>
      <button class="reset-btn" id="startBtn">New game</button>
    </div>
  </div>

  <div class="touch-controls" id="touchControls">
    <button class="dpad-btn" id="btnUp" aria-label="Up">&uarr;</button>
    <div class="dpad-row">
      <button class="dpad-btn" id="btnLeft" aria-label="Left">&larr;</button>
      <button class="dpad-btn" id="btnDown" aria-label="Down">&darr;</button>
      <button class="dpad-btn" id="btnRight" aria-label="Right">&rarr;</button>
    </div>
  </div>

  <button class="reset-btn" id="newGameBtn">New game</button>
</main>

<script src="../../js/pause.js"></script>
<script src="game.js"></script>
</body>
</html>
