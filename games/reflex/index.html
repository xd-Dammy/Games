<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0B0E14">
<title>Reflex — XD_Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/game-shared.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="game-body">
<header class="game-header">
  <a href="../../index.html" class="back-link">&larr; XD_Arcade</a>
  <h1 class="game-title">Reflex</h1>
</header>
<main class="game-main">
  <div class="scoreboard">
    <div class="score-item"><span class="score-label">Last</span><span class="score-val" id="lastVal">—</span></div>
    <div class="score-item"><span class="score-label">Average</span><span class="score-val" id="avgVal">—</span></div>
    <div class="score-item"><span class="score-label">Best</span><span class="score-val" id="bestVal">—</span></div>
  </div>
  <button class="rx-pad wait" id="pad"><span id="padMain">Tap to start</span><small id="padSub">5 rounds · wait for green</small></button>
  <p class="turn-indicator" id="statusMsg">Tap as soon as the screen turns green</p>
</main>
<script src="../../js/pause.js" data-auto="1" data-countdown="1"></script>
<script src="game.js"></script>
</body>
</html>
