<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0B0E14">
<title>Simon — XD_Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/game-shared.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="game-body">
<header class="game-header">
  <a href="../../index.html" class="back-link">&larr; XD_Arcade</a>
  <h1 class="game-title">Simon</h1>
  <div class="mode-toggle">
    <button class="mode-btn" id="soundBtn">🔊 Sound on</button>
  </div>
</header>
<main class="game-main">
  <div class="scoreboard">
    <div class="score-item"><span class="score-label">Round</span><span class="score-val" id="roundVal">0</span></div>
    <div class="score-item"><span class="score-label">Best</span><span class="score-val" id="bestVal">0</span></div>
  </div>
  <div class="simon-wrap">
    <div class="simon-pads" id="pads">
      <button class="pad pad-0" data-i="0" aria-label="Green"></button>
      <button class="pad pad-1" data-i="1" aria-label="Red"></button>
      <button class="pad pad-2" data-i="2" aria-label="Yellow"></button>
      <button class="pad pad-3" data-i="3" aria-label="Blue"></button>
    </div>
    <button class="simon-center" id="startBtn">START</button>
  </div>
  <p class="turn-indicator" id="statusMsg">Watch the pattern, then repeat it.</p>
</main>
<script src="../../js/pause.js" data-auto="1" data-countdown="1"></script>
<script src="game.js"></script>
</body>
</html>
