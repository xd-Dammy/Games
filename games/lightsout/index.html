<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0B0E14">
<title>Lights Out — XD_Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/game-shared.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="game-body">
<header class="game-header">
  <a href="../../index.html" class="back-link">&larr; XD_Arcade</a>
  <h1 class="game-title">Lights Out</h1>
</header>
<main class="game-main">
  <div class="scoreboard">
    <div class="score-item"><span class="score-label">Level</span><span class="score-val" id="levelVal">1</span></div>
    <div class="score-item"><span class="score-label">Moves</span><span class="score-val" id="movesVal">0</span></div>
    <div class="score-item"><span class="score-label">Cleared</span><span class="score-val" id="bestVal">—</span></div>
  </div>
  <div class="lo-board" id="board" role="grid" aria-label="Lights board"></div>
  <p class="turn-indicator" id="statusMsg">Turn every light off. Each tap flips a cell and its neighbours.</p>
  <div class="mode-toggle">
    <button class="mode-btn" id="hintBtn">💡 Hint</button>
    <button class="mode-btn" id="restartBtn">↺ Restart level</button>
  </div>
  <button class="reset-btn primary" id="nextBtn" hidden>Next level →</button>
</main>
<script src="../../js/pause.js"></script>
<script src="game.js"></script>
</body>
</html>
