<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0B0E14">
<title>Checkers — XD_Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/game-shared.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="game-body">
<header class="game-header">
  <a href="../../index.html" class="back-link">&larr; XD_Arcade</a>
  <h1 class="game-title">Checkers</h1>
  <div class="mode-toggle">
    <button class="mode-btn" data-mode="2p">2 Player</button>
    <button class="mode-btn" data-mode="easy">CPU Easy</button>
    <button class="mode-btn active" data-mode="medium">CPU Medium</button>
    <button class="mode-btn" data-mode="hard">CPU Hard</button>
  </div>
</header>
<main class="game-main">
  <div class="scoreboard">
    <div class="score-item"><span class="score-label" id="labelA">You</span><span class="score-val c4-a" id="scoreA">0</span></div>
    <div class="score-item"><span class="score-label">Draws</span><span class="score-val" id="scoreD">0</span></div>
    <div class="score-item"><span class="score-label" id="labelB">CPU</span><span class="score-val c4-b" id="scoreB">0</span></div>
  </div>
  <div class="ck-board" id="board" role="grid" aria-label="Checkers board"></div>
  <p class="turn-indicator" id="statusMsg">Your move (red)</p>
  <div class="mode-toggle">
    <button class="reset-btn" id="resetBtn">New game</button>
  </div>
</main>
<script src="game.js"></script>
</body>
</html>
