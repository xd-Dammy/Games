<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0B0E14">
<title>Blocks — XD_Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/game-shared.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="game-body">
<header class="game-header">
  <a href="../../index.html" class="back-link">&larr; XD_Arcade</a>
  <h1 class="game-title">Blocks</h1>
</header>
<main class="game-main">
  <div class="scoreboard">
    <div class="score-item"><span class="score-label">Score</span><span class="score-val" id="scoreVal">0</span></div>
    <div class="score-item"><span class="score-label">Lines</span><span class="score-val" id="linesVal">0</span></div>
    <div class="score-item"><span class="score-label">Level</span><span class="score-val" id="levelVal">1</span></div>
    <div class="score-item"><span class="score-label">Best</span><span class="score-val" id="bestVal">0</span></div>
  </div>
  <div class="bl-row">
    <canvas id="cv" class="bl-canvas" width="200" height="400"></canvas>
    <div class="bl-side">
      <span class="score-label">Next</span>
      <canvas id="next" class="bl-next" width="80" height="80"></canvas>
      <button class="reset-btn primary" id="startBtn">Start</button>
    </div>
  </div>
  <div class="bl-pad" id="pad">
    <button data-act="left" aria-label="Left">←</button>
    <button data-act="rotate" aria-label="Rotate">↻</button>
    <button data-act="right" aria-label="Right">→</button>
    <button data-act="down" aria-label="Soft drop">↓</button>
    <button data-act="drop" aria-label="Hard drop">⤓</button>
  </div>
  <p class="turn-indicator" id="statusMsg">Arrow keys / WASD · Space = drop · Up = rotate</p>
</main>
<script src="../../js/pause.js" data-auto="1" data-countdown="1"></script>
<script src="game.js"></script>
</body>
</html>
