<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a1a3a">
<title>Lagos Rush — XD_Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="lr-body">
<canvas id="cv"></canvas>

<a class="lr-back" href="../../index.html" aria-label="Back to XD_Arcade">&larr;</a>

<div class="hud" id="hud" hidden>
  <div class="hud-box"><span class="hud-label">DISTANCE</span><span class="hud-val" id="distVal">0m</span></div>
  <div class="hud-box"><span class="hud-label">NAIRA</span><span class="hud-val naira" id="nairaVal">₦0</span></div>
  <div class="hud-box"><span class="hud-label">SCORE</span><span class="hud-val" id="scoreVal">0</span></div>
  <button class="hud-pause" id="pauseBtn" aria-label="Pause">❚❚</button>
</div>
<div class="mission-chip" id="missionChip" hidden></div>
<button class="skip-btn" id="skipBtn" hidden>Skip ▶</button>
<div class="power-row" id="powerRow"></div>
<div class="toast" id="toast"></div>

<section class="panel dash" id="menu">
  <div class="dash-top">
    <div class="pill"><span class="s-label">BEST</span><span class="s-val" id="bestVal">0</span></div>
    <h1 class="lr-title mini">LAGOS <span>RUSH</span></h1>
    <div class="pill"><span class="s-label">NAIRA</span><span class="s-val naira" id="totalVal">₦0</span></div>
  </div>
  <div class="hero">
    <button class="hero-arrow" id="prevChar" type="button" aria-label="Previous character">&#8249;</button>
    <div class="hero-stage"><canvas id="heroCv"></canvas><div class="hero-lock" id="heroLock" hidden>🔒</div></div>
    <button class="hero-arrow" id="nextChar" type="button" aria-label="Next character">&#8250;</button>
  </div>
  <div class="hero-name" id="heroName">Naija</div>
  <div class="hero-role" id="heroRole"></div>
  <p class="char-info" id="charInfo"></p>
  <div class="char-strip" id="outfits"></div>
  <div class="loadout" id="loadout"></div>
  <button class="big-btn" id="playBtn">▶ PLAY</button>
  <div class="dash-nav">
    <button class="lr-help" type="button" id="shopBtn">🛒 Shop</button>
    <button class="lr-help" type="button" onclick="XDHowTo.open('lagosrush')">📖 How to play</button>
    <button class="lr-help" type="button" onclick="XDHowTo.openUpdates()">✨ Updates</button>
    <button class="lr-help icon" id="soundBtn" type="button" aria-label="Sound">🔊</button>
  </div>
</section>

<section class="panel shop" id="shop" hidden>
  <div class="shop-top"><button class="lr-help" id="shopBack" type="button">&larr; Back</button><h2>SHOP</h2><div class="pill"><span class="s-label">NAIRA</span><span class="s-val naira" id="shopNaira">₦0</span></div></div>
  <div class="shop-tabs" id="shopTabs"></div>
  <div class="shop-list" id="shopList"></div>
  <p class="shop-hint">Boosters you buy appear on the home screen. Tick the ones to take on your next run.</p>
</section>

<section class="panel" id="over" hidden>
  <h2 class="over-title" id="overTitle">WAHALA!</h2>
  <p class="over-line" id="overLine"></p>
  <div class="over-grid">
    <div><span class="s-label">DISTANCE</span><span class="s-val" id="oDist">0m</span></div>
    <div><span class="s-label">NAIRA</span><span class="s-val naira" id="oNaira">₦0</span></div>
    <div><span class="s-label">SCORE</span><span class="s-val" id="oScore">0</span></div>
    <div><span class="s-label">BEST</span><span class="s-val" id="oBest">0</span></div>
  </div>
  <div class="over-extra" id="oExtra" hidden></div>
  <div class="newbest" id="newBest" hidden>🏆 NEW BEST!</div>
  <button class="big-btn" id="againBtn">↻ RUN AGAIN</button>
  <button class="wa-btn" id="shareBtn">📲 Share your score</button>
  <button class="link-btn" id="menuBtn">Home &amp; shop</button>
</section>

<section class="panel" id="pausePanel" hidden>
  <h2 class="over-title">PAUSED</h2>
  <button class="big-btn" id="resumeBtn">▶ RESUME</button>
  <button class="lr-help" type="button" onclick="XDHowTo.open('lagosrush')">📖 How to play</button>
  <button class="link-btn" id="quitBtn">Quit to menu</button>
</section>

<script src="../../js/howto.js" data-button="0"></script>
<script src="engine.js"></script>
<script src="art.js"></script>
<script src="story.js"></script>
<script src="dash.js"></script>
<script src="game.js"></script>
</body>
</html>
