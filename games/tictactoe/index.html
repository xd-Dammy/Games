<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0B0E14">
<title>Tic-Tac-Toe — XD_Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="game-body">

<header class="game-header">
  <a href="../../index.html" class="back-link">&larr; XD_Arcade</a>
  <h1 class="game-title">Tic-Tac-Toe</h1>
  <div class="mode-toggle">
    <button id="mode2p" class="mode-btn active">2 Player</button>
    <button id="modeCPU" class="mode-btn">vs CPU</button>
  </div>
</header>

<div class="mode-toggle diff-toggle" id="difficultyToggle" hidden>
  <button class="mode-btn diff-btn" data-diff="easy">Easy</button>
  <button class="mode-btn diff-btn active" data-diff="medium">Medium</button>
  <button class="mode-btn diff-btn" data-diff="expert">Expert</button>
</div>

<main class="game-main">
  <div class="scoreboard">
    <div class="score-item score-x">
      <span class="score-label">X</span>
      <span class="score-val" id="scoreX">0</span>
    </div>
    <div class="score-item score-draw">
      <span class="score-label">Draws</span>
      <span class="score-val" id="scoreD">0</span>
    </div>
    <div class="score-item score-o">
      <span class="score-label">O</span>
      <span class="score-val" id="scoreO">0</span>
    </div>
  </div>

  <div class="board" id="board" role="grid" aria-label="Tic-tac-toe board"></div>

  <p class="turn-indicator" id="turnIndicator">X's turn</p>

  <button class="reset-btn" id="resetBtn">New round</button>
</main>

<script src="../../js/pause.js"></script>
<script src="game.js"></script>
</body>
</html>
