<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0B0E14">
<title>Rock Paper Scissors — XD_Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/game-shared.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="game-body">
<header class="game-header">
  <a href="../../index.html" class="back-link">&larr; XD_Arcade</a>
  <h1 class="game-title">Rock Paper Scissors</h1>
</header>
<main class="game-main">
  <div class="scoreboard">
    <div class="score-item"><span class="score-label">You</span><span class="score-val c4-a" id="scoreA">0</span></div>
    <div class="score-item"><span class="score-label">Draws</span><span class="score-val" id="scoreD">0</span></div>
    <div class="score-item"><span class="score-label">CPU</span><span class="score-val c4-b" id="scoreB">0</span></div>
  </div>
  <div class="rps-arena">
    <div class="rps-hand" id="handYou">❔</div>
    <div class="rps-vs">VS</div>
    <div class="rps-hand" id="handCpu">❔</div>
  </div>
  <p class="turn-indicator" id="statusMsg">Pick your move</p>
  <div class="rps-picks">
    <button class="rps-btn" data-move="rock">🪨<span>Rock</span></button>
    <button class="rps-btn" data-move="paper">📄<span>Paper</span></button>
    <button class="rps-btn" data-move="scissors">✂️<span>Scissors</span></button>
  </div>
  <button class="reset-btn" id="resetBtn">Reset score</button>
</main>
<script src="../../js/pause.js"></script>
<script src="game.js"></script>
</body>
</html>
