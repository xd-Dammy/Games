<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0B0E14">
<title>Riddles & Tricks — XD_Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/game-shared.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="game-body">
<header class="game-header">
  <a href="../../index.html" class="back-link">&larr; XD_Arcade</a>
  <h1 class="game-title">Riddles & Tricks</h1>
  <div class="mode-toggle">
    <button class="mode-btn active" data-kind="riddle">Riddles</button>
    <button class="mode-btn" data-kind="trick">Trick questions</button>
  </div>
</header>
<main class="game-main">
  <div class="scoreboard">
    <div class="score-item"><span class="score-label">Solved</span><span class="score-val" id="solvedVal">0</span></div>
    <div class="score-item"><span class="score-label">Streak</span><span class="score-val" id="streakVal">0</span></div>
    <div class="score-item"><span class="score-label">Best streak</span><span class="score-val" id="bestVal">0</span></div>
  </div>
  <div class="rd-card">
    <span class="rd-tag" id="tagEl">Riddle</span>
    <p class="rd-q" id="qEl"></p>
    <p class="rd-hint" id="hintEl" hidden></p>
  </div>
  <div class="rd-form" id="formEl">
    <input id="ansInput" class="rd-input" type="text" placeholder="Type your answer…" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
    <button class="reset-btn primary" id="submitBtn">Check</button>
  </div>
  <p class="turn-indicator" id="statusMsg">Think carefully…</p>
  <div class="mode-toggle">
    <button class="mode-btn" id="hintBtn">💡 Hint</button>
    <button class="mode-btn" id="revealBtn">Show answer</button>
    <button class="reset-btn primary" id="nextBtn" hidden>Next →</button>
  </div>
</main>
<script src="game.js"></script>
</body>
</html>
