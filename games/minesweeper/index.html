<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0B0E14">
<title>Minesweeper — XD_Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/game-shared.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="game-body">
<header class="game-header">
  <a href="../../index.html" class="back-link">&larr; XD_Arcade</a>
  <h1 class="game-title">Minesweeper</h1>
  <div class="mode-toggle">
    <button class="mode-btn active" data-diff="easy">Easy</button>
    <button class="mode-btn" data-diff="medium">Medium</button>
    <button class="mode-btn" data-diff="hard">Hard</button>
  </div>
</header>
<main class="game-main">
  <div class="scoreboard">
    <div class="score-item"><span class="score-label">Mines</span><span class="score-val" id="minesVal">10</span></div>
    <div class="score-item"><span class="score-label">Time</span><span class="score-val" id="timeVal">0:00</span></div>
    <div class="score-item"><span class="score-label">Best</span><span class="score-val" id="bestVal">—</span></div>
  </div>
  <div class="ms-board" id="board" role="grid" aria-label="Minesweeper board"></div>
  <div class="mode-toggle">
    <button class="mode-btn active" id="digBtn">⛏ Dig</button>
    <button class="mode-btn" id="flagBtn">🚩 Flag</button>
  </div>
  <p class="turn-indicator" id="statusMsg">Tap to dig. Long-press or use Flag to mark mines.</p>
  <button class="reset-btn" id="resetBtn">New game</button>
</main>
<script src="../../js/pause.js" data-auto="1"></script>
<script src="game.js"></script>
</body>
</html>
